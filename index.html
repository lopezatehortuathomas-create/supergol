<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Gol - Inicio de Sesión</title>
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="login-card">
            
            <div class="header">
                <div class="logo">
                    <span class="icon-placeholder">⚽🏍️</span>
                    <h1>SUPER GOL</h1>
                </div>
                <h2>INICIO DE SESIÓN</h2>
                <span class="badge">RNF 01</span>
            </div>

            <div class="form-body">
                <h3>Bienvenido a Super Gol (Samaca)</h3>
                <p class="subtitle">Accede a tus reservas y servicios.</p>

                <form>
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="••••••" required>
                            <i class="fa-regular fa-eye-slash toggle-password"></i>
                        </div>
                        <div class="forgot-password">
                            <a href="#">Olvidé mi contraseña</a>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">INICIAR SESIÓN</button>
                </form>
            </div>

            <div class="footer">
                <p>¿Eres Administrador (Samaca) o Usuario Normal?</p>
                <p class="signup-text">¿No tienes cuenta? <a href="#">Regístrate</a></p>
            </div>

        </div>
    </div>

</body>
</html>
